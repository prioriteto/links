<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOBAZAR UKRAINE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000 url('background.jpg') center top / cover no-repeat fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }
        .header p {
            font-size: 14px;
            color: #eee;
            margin-bottom: 28px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }
        
        .accordion-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .accordion-btn i.main-icon { font-size: 20px; width: 28px; text-align: left; }
        .accordion-btn i.arrow-icon { font-size: 14px; transition: transform 0.3s ease; }
        .accordion-btn.active i.arrow-icon { transform: rotate(180deg); }
        
        .panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 4px;
        }
        
        .sub-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #24a1de;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .sub-link.instagram { color: #e1306c; }
        .sub-link.tiktok { color: #00f2fe; }

        .btn-direct {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .btn-direct i.main-icon { font-size: 20px; width: 28px; text-align: left; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <div class="header">
            <h1>AUTOBAZAR UKRAINE</h1>
            <p>список наших соцмереж</p>
        </div>

        <!-- TELEGRAM -->
        <button class="accordion-btn">
            <span><i class="fa-brands fa-telegram main-icon" style="color:#24a1de;"></i> TELEGRAM</span>
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <div class="panel">
            <div class="sub-link" onclick="openApp('tg://resolve?domain=autobazar_uaa1', 'https://t.me/autobazar_uaa1')">Основний Телеграм</div>
            <div class="sub-link" onclick="openApp('tg://resolve?domain=autobazar_ukrainee', 'https://t.me/autobazar_ukrainee')">Телеграм 2</div>
            <div class="sub-link" onclick="openApp('tg://resolve?domain=kartell_auto', 'https://t.me/kartell_auto')">Телеграм 3</div>
        </div>

        <!-- TIKTOK -->
        <button class="accordion-btn">
            <span><i class="fa-brands fa-tiktok main-icon" style="color:#00f2fe;"></i> TIKTOK</span>
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <div class="panel">
            <div class="sub-link tiktok" onclick="openApp('snssdk1128://user/profile/autobazar_ukraine', 'https://www.tiktok.com/@autobazar_ukraine')">Основний ТікТок</div>
            <div class="sub-link tiktok" onclick="openApp('snssdk1128://user/profile/autobazar_ukrainian', 'https://www.tiktok.com/@autobazar_ukrainian')">ТікТок 2</div>
        </div>

        <!-- INSTAGRAM -->
        <button class="accordion-btn">
            <span><i class="fa-brands fa-instagram main-icon" style="color:#e1306c;"></i> INSTAGRAM</span>
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <div class="panel">
            <div class="sub-link instagram" onclick="openApp('instagram://user?username=avtobazar.ukrainian', 'https://www.instagram.com/avtobazar.ukrainian')">Основний Інстаграм</div>
            <div class="sub-link instagram" onclick="openApp('instagram://user?username=carsale.ukrainian', 'https://www.instagram.com/carsale.ukrainian')">Інстаграм 2</div>
        </div>

        <!-- THREADS -->
        <div class="btn-direct" onclick="openApp('barcelona://user?username=autobazar_ua1', 'https://www.threads.net/@autobazar_ua1')">
            <span><i class="fa-brands fa-threads main-icon"></i> THREADS</span>
            <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:14px; opacity:0.6;"></i>
        </div>
    </div>

    <script>
        const acc = document.getElementsByClassName("accordion-btn");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                const panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        }

        function openApp(appUrl, webUrl) {
            window.location.href = appUrl;
            setTimeout(function() {
                window.location.href = webUrl;
            }, 500);
        }
    </script>
</body>
</html>
